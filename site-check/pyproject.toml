# Packaging for PyPI. Nothing is published yet, and the name below has not been
# checked against PyPI: it is the one place to change it (tests/test_packaging.py
# reads it from here and from sitecheck.DIST_NAME).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-check-passive"
dynamic = ["version"]
description = "Passive, outside-in website check: reads only what a visitor's browser reads and writes a reproducible report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Federico Medinilla" }]
keywords = ["website", "audit", "passive", "security-headers", "pagespeed", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
# Standard library only at runtime; the CLI refuses to run otherwise.
dependencies = []

[project.urls]
Homepage = "https://github.com/Fedemedinilla/applied-ai-toolkit/tree/main/site-check"
Source = "https://github.com/Fedemedinilla/applied-ai-toolkit"

[project.scripts]
site-check = "sitecheck.cli:main"

[tool.setuptools]
packages = ["sitecheck", "sitecheck.checks", "sitecheck.catalogs", "sitecheck.schema"]
include-package-data = false

# The published schema lives in site-check/schema/ and is installed as sitecheck/schema/.
[tool.setuptools.package-dir]
"sitecheck.schema" = "schema"

[tool.setuptools.dynamic]
version = { attr = "sitecheck.__version__" }

[tool.setuptools.package-data]
"sitecheck.catalogs" = ["*.json"]
"sitecheck.schema" = ["*.json"]
