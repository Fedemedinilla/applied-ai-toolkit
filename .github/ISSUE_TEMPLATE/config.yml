# Every issue starts from a form, so a bug report always names its folder and version.
# security_contact.yml is the one form that asks for no detail, for SECURITY.md's fallback.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/Fedemedinilla/applied-ai-toolkit/security/advisories/new
    about: Report it in private, not as an issue. If this link shows no form, use the private security contact form. See SECURITY.md.
