# Builds the apps that work as static files and deploys them to GitHub Pages, at
# https://fedemedinilla.github.io/applied-ai-toolkit/ (Caja, Receipt, Replay Lab, Site checklist,
# and a landing page that lists them). The apps that need a server are not published.
# The docs site (docs-site/, generated from the READMEs) is built into docs/ of the same artifact.
# Pages has to be enabled once in the repository: Settings > Pages > Source: GitHub Actions.
#
# No secret is read. The build job can only read the repository. The deploy job holds the two
# write permissions a Pages deploy needs (pages, id-token) and no other, and it only publishes the
# artifact the build job uploaded. agent-playbook/test/workflow-secrets.test.ts checks this file
# with that policy and every other workflow with none.
# Actions are pinned to the commit SHA of their release tag, with the version in a comment.
# upload-pages-artifact is a composite action: v5.0.0 pins the upload-artifact it calls by SHA too
# (v3 called it by the movable v4 tag). Since v4 it leaves dotfiles out; dist/pages has none.
name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a deploy in progress finishes before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the static demos and the docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json

      - run: npm ci

      # Builds the four apps into dist/apps/ and assembles dist/pages/ (apps/pages.ts). The variable
      # is a placeholder, not a secret. The build sees it, so if a build inlined it, the guard below
      # would find it.
      - name: Build the site
        run: npm run build:pages
        env:
          ANTHROPIC_API_KEY: ci-placeholder-anthropic-0001

      # The same guard CI runs, over the builds that are about to be published, with the same
      # placeholder: the secrets check searches every published build for it.
      - name: Guard the published builds
        run: npm run guard:pages
        env:
          ANTHROPIC_API_KEY: ci-placeholder-anthropic-0001

      # The docs site has its own lockfile, so the root npm ci above installs nothing for it. Its
      # build writes the pages from the READMEs, fails on a broken relative link, and checks every
      # internal link of the result. It is copied in after build:pages, which empties dist/pages/.
      - name: Build the docs into docs/
        run: |
          npm run build:docs
          cp -R docs-site/dist dist/pages/docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
