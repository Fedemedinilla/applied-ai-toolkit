# Runs the same commands as the root README: type check, the Vitest suites, the import fences,
# the pack check of the npm packages, the app builds and their CSP guard, the site-check unittest
# suite, slop-lint over the repository's own docs, and the wp-hardening PHPUnit suite in a job of
# its own. A third job runs the repository's two composite actions (./slop-lint and
# ./csp-build-guard) as a user's workflow would, and checks the SARIF each one writes. It does not
# upload SARIF: that needs security-events: write, which no job here has. Tests make no network
# call; the only downloads are the locked npm and Composer packages, and zod for the guard action.
# No job has secrets. Actions are pinned to the commit SHA of their release tag, with the version
# in a comment. To upgrade one, change both. setup-node is pinned again in slop-lint/action.yml and
# csp-build-guard/action.yml, and their tests fail until the three SHAs match.
name: CI

# Pushes to main, and pull requests. A push to a PR branch runs once, through pull_request.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# With an explicit bash shell, steps run with -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: TypeScript tests
        run: npm test

      - name: Import fences
        run: node import-fences/cli.ts --config import-fences/repo.config.ts

      # Packs the npm packages (gateway, slop-lint) as a publish would, installs each tarball in a
      # project outside the repository and checks its exports, its types and the slop-lint bin.
      # Offline. Kept out of npm test because it builds and packs, about 12 s.
      - name: Pack the npm packages
        run: npm run pack:check

      # npm test already builds each app into a temporary folder. This builds every app into
      # dist/apps/ and runs csp-build-guard over each output, the way a deploy would see it.
      # The variables are placeholders, not secrets: with them set, the guard's secrets check
      # searches each build for these values instead of skipping. Keep both lists the same.
      - name: Build the apps
        run: npm run build:apps
        env:
          ANTHROPIC_API_KEY: ci-placeholder-anthropic-0001
          CHAT_WIDGET_SESSION_SECRET: ci-placeholder-session-secret-0001-0123456789
          CHAT_WIDGET_ADMIN_PASSWORD: ci-placeholder-admin-0001
          PUSH_LAB_VAPID_PRIVATE_KEY: ci-placeholder-vapid-0001
          ASSISTANT_HISTORY_SECRET: ci-placeholder-history-secret-0001-0123456789

      - name: Guard the app builds
        run: npm run guard:apps
        env:
          ANTHROPIC_API_KEY: ci-placeholder-anthropic-0001
          CHAT_WIDGET_SESSION_SECRET: ci-placeholder-session-secret-0001-0123456789
          CHAT_WIDGET_ADMIN_PASSWORD: ci-placeholder-admin-0001
          PUSH_LAB_VAPID_PRIVATE_KEY: ci-placeholder-vapid-0001
          ASSISTANT_HISTORY_SECRET: ci-placeholder-history-secret-0001-0123456789

      # site-check needs Python 3.11 or newer and nothing outside the standard library.
      # ubuntu-latest ships Python 3; this step fails early if it is too old.
      - name: Python version
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else "site-check needs Python 3.11 or newer")'

      - name: site-check tests
        run: npm run test:python

      # The docs must pass their own linter: no tier 1 finding in any README or the case study.
      - name: Lint the docs
        run: npm run lint:docs

  # The local actions, used the way the README of each one shows, from this checkout. fail: true,
  # so a finding fails the job; then each SARIF file must parse as JSON with version 2.1.0 and at
  # least one run whose tool is the action's own.
  actions:
    name: Composite actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The same files as npm run lint:docs.
      - id: slop
        name: slop-lint action over the docs
        uses: ./slop-lint
        with:
          files: >-
            README.md SECURITY.md CONTRIBUTING.md .github/pull_request_template.md
            */README.md apps/*/README.md */CASE-STUDY.md agent-playbook/templates/*.md
            agent-playbook/claude/agents/*.md deterministic-sim/.claude/agents/*.md
            apps/checklist/data/source/*.md slop-lint/research/*.md .changeset/README.md
          lang: en
          format: markdown
          sarif-file: ${{ runner.temp }}/sarif/slop-lint.sarif
          fail: true

      # The placeholder is not a secret; with it set, the guard's secrets check runs instead of skipping.
      - name: Build caja
        run: npm run build:caja
        env:
          ANTHROPIC_API_KEY: ci-placeholder-anthropic-0001

      - id: guard
        name: csp-build-guard action over the caja build
        uses: ./csp-build-guard
        with:
          dir: dist/apps/caja
          config: apps/caja/csp-guard.config.json
          sarif-file: ${{ runner.temp }}/sarif/csp-build-guard.sarif
          fail: true
        env:
          ANTHROPIC_API_KEY: ci-placeholder-anthropic-0001

      - name: Check the SARIF files
        env:
          SLOP_SARIF: ${{ steps.slop.outputs.sarif-file }}
          GUARD_SARIF: ${{ steps.guard.outputs.sarif-file }}
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            for (const [file, tool] of [[process.env.SLOP_SARIF, "slop-lint"], [process.env.GUARD_SARIF, "csp-build-guard"]]) {
              if (!file) throw new Error(`${tool}: the action reported no SARIF file`);
              const log = JSON.parse(readFileSync(file, "utf8"));
              if (log.version !== "2.1.0") throw new Error(`${file}: version is ${log.version}, not 2.1.0`);
              const run = Array.isArray(log.runs) ? log.runs[0] : undefined;
              if (run?.tool?.driver?.name !== tool) throw new Error(`${file}: no run from ${tool}`);
              console.log(`${file}: SARIF ${log.version}, ${log.runs.length} run, ${run.results?.length ?? 0} results`);
            }
          '

  php:
    name: wp-hardening (PHP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wp-hardening
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-latest ships PHP and Composer. The plugin needs PHP 8.1 or newer (composer.json
      # pins the platform to 8.1.0); this step fails early if the runner's PHP is older.
      - name: PHP version
        run: |
          php --version
          composer --version
          php -r 'exit(version_compare(PHP_VERSION, "8.1.0", ">=") ? 0 : 1);' || { echo "wp-hardening needs PHP 8.1 or newer"; exit 1; }

      # composer.lock is committed; validate fails if it is out of date with composer.json.
      - name: Validate composer.json and the lock
        run: composer validate --strict --no-check-publish

      - name: Install the locked dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntax check
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: PHPUnit
        run: vendor/bin/phpunit
